{k:`rush`,use:[1.3,4.5],wind:.5,rest:.9,speed:12,time:.4,daze:.9},{k:`swing`,use:[0,1.2],wind:.45,rest:.8,reach:.95,arc:1.8,mult:1.1}]},eye:{name:`Ojo del Abismo`,hp:115,dmg:13,knock:6,speed:1.8,weight:1,color:`#c06bff`,dark:`#4a1a7a`,size:1,xp:23,gold:14,move:`walk`,keep:5,attacks:[{k:`shot`,use:[2,8],wind:.65,rest:1.5,speed:8,life:1.2,count:4,spread:.25,mult:.8,color:`#e0a8ff`},{k:`mark`,use:[0,99],wind:.5,rest:1.6,count:1,radius:1.1,delay:1,color:`#c06bff`}]},abyss:{name:`Corazón del Abismo`,hp:1050,dmg:16,knock:12,speed:0,weight:.05,color:`#8a2ad8`,dark:`#22083a`,size:2.6,xp:600,gold:450,move:`still`,keep:0,boss:!0,attacks:[{k:`mark`,use:[0,99],wind:.6,rest:1.1,count:5,radius:1.15,delay:1,color:`#c06bff`},{k:`shot`,use:[0,99],wind:.8,rest:1.2,speed:7,life:2,count:8,spread:.4,color:`#e0a8ff`},{k:`nova`,use:[0,3.4],wind:.9,rest:1.2,radius:3.2,mult:1.3,color:`#c06bff`},{k:`summon`,use:[0,99],wind:.8,rest:1.6,kind:`shade`,count:2,cap:4}]}},ke=`Tomasa`,Ae={intro:[{who:`narrator`,text:`Hace mucho tiempo, las islas flotaban tranquilas sobre el Abismo.`},{who:`narrator`,text:`Pero algo, allá abajo, ha empezado a tirar de ellas. Cada día se hunde un trozo más.`},{who:`mentor`,text:`¡Por fin llegas, {hero}! Soy Tomasa, y este campamento es lo último que queda en pie de la Pradera.`},{who:`mentor`,text:`Dicen que en el cráter del Volcán duerme el Dragón de lava, y que su corazón es lo que arrastra las islas al vacío.`},{who:`mentor`,text:`Cinco tierras, cinco guardianes. Vence a cada uno y llévate su ancla de piedra: con las cinco, el suelo dejará de caer.`},{who:`hero`,text:`Pues habrá que ir. ¿Por dónde empiezo?`},{who:`mentor`,text:`Por los slimes de ahí fuera. Y si encuentras oro, pásate por mi tienda: tengo pociones y algún trasto útil.`}],boss0:[{who:`king_slime`,text:`¡Blup! ¿Quién osa chapotear en el charco real?`},{who:`hero`,text:`Vengo a por tu ancla de piedra, majestad.`},{who:`king_slime`,text:`¡Mi ancla es mi corona! Y mi corona es... ¡blup!... ¡MÍA!`}],after0:[{who:`mentor`,text:`¡La primera ancla! Mira: el suelo de la Pradera ha dejado de temblar.`},{who:`mentor`,text:`El camino sigue por el Desierto. Llévate agua... y ganas de pelear.`}],boss1:[{who:`narrator`,text:`La arena tiembla. Algo enorme se mueve bajo tus pies.`},{who:`worm`,text:`Llevo mil años durmiendo bajo estas dunas. Mil años sin postre.`},{who:`hero`,text:`Yo no soy un postre.`},{who:`worm`,text:`Eso ya lo veremos.`}],after1:[{who:`mentor`,text:`Dos anclas. Ese gusano no volverá a tragarse a nadie.`},{who:`mentor`,text:`Ahora toca el Bosque otoñal. Dicen que allí los árboles escuchan... y se acuerdan de todo.`}],boss2:[{who:`ent`,text:`Hrrrm... Cada hoja que cae es una isla que se pierde.`},{who:`hero`,text:`Entonces ayúdame a pararlo.`},{who:`ent`,text:`El ancla echó raíces en mi corazón. Si la quieres... tendrás que arrancarla.`}],after2:[{who:`mentor`,text:`El viejo Ent te ha dado su ancla. Creo que, en el fondo, quería que alguien lo liberase.`},{who:`mentor`,text:`Abrígate, {hero}: la Tundra helada es la siguiente.`}],boss3:[{who:`narrator`,text:`Un bloque de hielo del tamaño de una casa se levanta despacio.`},{who:`golem`,text:`INTRUSO DETECTADO. TEMPERATURA: DEMASIADO ALTA.`},{who:`hero`,text:`Gracias, me lo dicen mucho.`},{who:`golem`,text:`ENFRIANDO INTRUSO.`}],after3:[{who:`mentor`,text:`¡Cuatro anclas! Siento el calor del Volcán desde aquí. El Dragón ya sabe que vas a por él.`},{who:`mentor`,text:`Cuando quieras, ve. Yo guardaré el campamento... y la tienda.`}],boss4:[{who:`narrator`,text:`El cráter ruge. Las rocas caen hacia arriba, hacia el cielo rojo.`},{who:`dragon`,text:`Así que tú eres quien va recogiendo mis anclas, {hero}.`},{who:`hero`,text:`Y tú eres quien hunde las islas.`},{who:`dragon`,text:`El Abismo tiene hambre. Yo solo le doy de comer. ¿Quieres ser el plato principal?`},{who:`hero`,text:`Prefiero ser quien apaga el fogón.`}],after4:[{who:`narrator`,text:`El corazón del Dragón se apaga con un último suspiro de humo.`},{who:`dragon`,text:`Qué ingenuidad... yo solo era su perro guardián. El Abismo... ya está despierto.`},{who:`narrator`,text:`Las cinco anclas brillan a la vez y las islas dejan de caer. Pero el suelo del cráter se abre, y una escalera de piedra baja hacia la oscuridad.`},{who:`mentor`,text:`¡{hero}! Las anclas aguantan, pero algo tira desde abajo con más fuerza que nunca.`},{who:`mentor`,text:`Bajo el Volcán están las tierras de abajo: el Pantano, las Cavernas, las Ruinas, las Cumbres... y al fondo, el Corazón del Abismo.`},{who:`hero`,text:`Pues habrá que bajar. Guárdame unas pociones.`},{who:`mentor`,text:`Ahí abajo todo pega más fuerte. Mejora tu equipo antes de cada guardián, y no te avergüences de repetir combates.`}],boss5:[{who:`narrator`,text:`El agua negra burbujea. Cinco cuellos se alzan a la vez.`},{who:`hydra`,text:`¿Otro héroe? Qué bien. Cada una de mis cabezas tenía hambre.`},{who:`hero`,text:`¿Y cuál de ellas manda?`},{who:`hydra`,text:`¡YO! ¡No, YO! ¡Callaos todas y muérdelo!`}],after5:[{who:`mentor`,text:`La Hidra ya no discutirá con nadie. Bien hecho.`},{who:`mentor`,text:`Ahora, las Cavernas de cristal. Brillan muy bonito... y cortan muy feo.`}],boss6:[{who:`spider`,text:`Mis hijos me han hablado de ti. Pisas muy fuerte para caber en una de mis patas, {hero}.`},{who:`hero`,text:`Tus hijos muerden demasiado.`},{who:`spider`,text:`Han salido a su madre. No te muevas: esto solo dolerá muchísimo.`}],after6:[{who:`mentor`,text:`Sin su reina, las cavernas se han quedado en silencio. Hasta los cristales parecen respirar.`},{who:`mentor`,text:`Más abajo están las Ruinas malditas. Allí los muertos no descansan... por culpa de alguien.`}],boss7:[{who:`narrator`,text:`Las velas del altar se encienden solas, con una llama verde.`},{who:`lich`,text:`Te doy la bienvenida, {hero}. Siempre me faltan huesos para mi ejército.`},{who:`hero`,text:`Los míos están ocupados. Búscate otros.`},{who:`lich`,text:`Todos dicen eso. Al final, todos acaban trabajando para mí.`}],after7:[{who:`mentor`,text:`Los esqueletos han caído como fichas de dominó. Esas ruinas por fin descansan.`},{who:`mentor`,text:`Te quedan las Cumbres de la tormenta. Agárrate fuerte: allí el viento quiere tirarte al vacío.`}],boss8:[{who:`narrator`,text:`Un relámpago parte el cielo en dos. Algo enorme planea entre las nubes.`},{who:`thunderbird`,text:`Nadie ha subido nunca hasta mi nido. Nadie ha bajado nunca de él.`},{who:`hero`,text:`Siempre hay una primera vez.`},{who:`thunderbird`,text:`Y una última.`}],after8:[{who:`mentor`,text:`Cuatro guardianes de abajo. Solo queda el fondo, {hero}: el Corazón del Abismo.`},{who:`mentor`,text:`Es lo que arrastra las islas desde el principio. Si lo apagas, se acabó para siempre. Ve con todo lo que tengas.`}],boss9:[{who:`narrator`,text:`No hay suelo, ni cielo. Solo un latido enorme, que hace temblar todo lo que existe.`},{who:`abyss`,text:`TAN POCA COSA. TAN CÁLIDA. HAS APAGADO A MIS GUARDIANES UNO A UNO.`},{who:`hero`,text:`Y tú eres el último.`},{who:`abyss`,text:`YO SOY EL FONDO DE TODO. TODO CAE HACIA MÍ. TAMBIÉN TÚ.`},{who:`hero`,text:`Hoy no.`}],ending:[{who:`narrator`,text:`El latido se detiene. Por primera vez en mil años, el Abismo calla.`},{who:`narrator`,text:`Muy arriba, las islas dejan de temblar. Nada vuelve a tirar de ellas.`},{who:`mentor`,text:`Lo has logrado, {hero}. Diez guardianes, y el corazón del mismísimo Abismo.`},{who:`hero`,text:`¿Y ahora qué?`},{who:`mentor`,text:`Ahora descansas. Y mañana... bueno, siempre queda algún slime que aplastar.`},{who:`narrator`,text:`FIN. Gracias por jugar a La Senda del Abismo. Puedes repetir cualquier combate para hacerte aún más fuerte.`}]},je=e=>`boss${e}`,Me=(e,t)=>e>=t-1?`ending`:`after${e}`,Ne=(e,t)=>e.replace(/\{hero\}/g,t),Pe=[`weapon`,`armor`,`amulet`,`head`,`feet`],Fe=[{name:`Común`,color:`#f2f2f2`,bonus:1,price:1,lvl:0},{name:`Rara`,color:`#5fb0ff`,bonus:1.5,price:2.2,lvl:1},{name:`Épica`,color:`#c27bff`,bonus:2.2,price:4.5,lvl:2},{name:`Legendaria`,color:`#ffa63
