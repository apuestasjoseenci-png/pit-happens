<body>

<script>
'use strict';
// Suelo Roto: eight medieval heroes on a big floating arena with walls, rocks and crates. It
// crumbles from the edges in, every ability cracks the floor, catapults join in later. Last one
// standing wins. 2.5D: a high tilted camera that follows you, every figure drawn in code.

// ---- Built to be checked ----------------------------------------------------------------
const params = new URLSearchParams(location.search);
const tune = new Proxy({}, { get: (_, k) => CONFIG[k].value }); // live: tune.speed is CONFIG.speed.value
const STEP = 1 / 60;            // simulation step in seconds; motion is per second, never per frame
let W = 1280, H = 720;          // logical size: landscape, or 720x1280 on a phone held upright
const PIXEL = false;
const FONT = '"Arial Black", "Arial Rounded MT Bold", "Trebuchet MS", sans-serif';
const TITLE = 'SUELO ROTO';
const CONTROLS = ['WASD / flechas: moverse', 'J o Espacio: atacar (mantén pulsado)', 'K: habilidad (rompe el suelo)',
  'L o Shift: esquivar', 'P: pausa   ·   M: sonido', 'En el móvil: joystick a la izquierda, botones a la derecha'];
const clock = window.GAME_CLOCK || { now: () => performance.now() / 1000 }; // a check may inject one
const CHEAP = params.get('render') === 'cheap';
let seed;
function rng() { // mulberry32; every gameplay random call reads this, never Math.random
  seed = (seed + 0x6D2B79F5) | 0;
  let t = Math.imul(seed ^ (seed >>> 15), seed | 1);
  t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}
const events = [];

// ---- Screen ---------------------------------------------------------------------------
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let portrait = false;
function fit() { // fills the window at any size and pixel ratio; upright phones get a tall view
  portrait = innerHeight > innerWidth * 1.05;
  W = portrait ? 720 : 1280; H = portrait ? 1280 : 720;
  const k = Math.min(innerWidth / W, innerHeight / H);
  const r = k * (devicePixelRatio || 1);
  canvas.width = Math.round(W * r); canvas.height = Math.round(H * r);
  canvas.style.width = Math.round(W * k) + 'px'; canvas.style.height = Math.round(H * k) + 'px';
  canvas.style.marginTop = Math.max(0, Math.floor((innerHeight - H * k) / 2)) + 'px';
  ctx.setTransform(r, 0, 0, r, 0, 0); ctx.imageSmoothingEnabled = true;
}
addEventListener('resize', fit); fit();
function clear(c) { ctx.fillStyle = c; ctx.fillRect(0, 0, W, H); }
function text(s, x, y, size, c, align = 'center') {
  ctx.fillStyle = c; ctx.font = `${size}px ${FONT}`; ctx.textAlign = align;
  ctx.textBaseline = 'middle'; ctx.fillText(s, x, y);
}
/** Text with a thick dark outline, the cartoon HUD style. */
function textO(s, x, y, size, c, align = 'center', stroke = '#1a1430') {
  ctx.font = `${size}px ${FONT}`; ctx.textAlign = align; ctx.textBaseline = 'middle';
  ctx.lineJoin = 'round'; ctx.lineWidth = Math.max(3, size * 0.24); ctx.strokeStyle = stroke;
  if (size >= 16) { const a = ctx.globalAlpha; ctx.globalAlpha = a * 0.55; ctx.strokeText(s, x, y + Math.max(2, size * 0.1)); ctx.globalAlpha = a; }
  ctx.strokeText(s, x, y); ctx.fillStyle = c; ctx.fillText(s, x, y);
}

// ---- Input: keys by position (event.code), OS key repeat ignored ------------------------
const down = new Set(), hit = new Set();
const pressed = code => hit.has(code);
addEventListener('keydown', e => {
  startAudio();
  if (!e.repeat) { down.add(e.code); hit.add(e.code); }
  if (e.code === 'Space' || e.code.startsWith('Arrow')) e.preventDefault();
});
addEventListener('keyup', e => down.delete(e.code));
addEventListener('pointerdown', () => startAudio());
addEventListener('blur', () => { down.clear(); touch.attack = false; touch.joyId = null; touch.ax = touch.ay = 0; });

// Touch: a floating joystick on the left half, buttons on the right.
const touch = { on: false, joyId: null, ox: 0, oy: 0, x: 0, y: 0, ax: 0, ay: 0, attack: false, attackId: null };
function touchButtons() {
  const b = Math.min(W, H), u = b / 720;
  return {
    attack:  { x: W - b * 0.17, y: H - b * 0.2, r: b * 0.095, code: 'KeyJ', label: 'ATACAR' },
    special: { x: W - b * 0.38, y: H - b * 0.12, r: b * 0.075, code: 'KeyK', label: 'HABILIDAD' },
    dodge:   { x: W - b * 0.13, y: H - b * 0.42, r: b * 0.065, code: 'KeyL', label: 'ESQUIVA' },
    pause:   { x: W - 196 * u, y: 40 * u, r: 26 * u, code: 'KeyP', label: 'II' },
  };
}
function toLogical(e) {
  const r = canvas.getBoundingClientRect();
  return [(e.clientX - r.left) / r.width * W, (e.clientY - r.top) / r.height * H];
}
let cardRects = []; // the hero cards on the select screen, for taps and clicks
canvas.addEventListener('pointerdown', e => {
  e.preventDefault();
  if (e.pointerType !== 'mouse') touch.on = true;
  const [x, y] = toLogical(e);
  if (scene === 'select') {
    const c = cardRects.find(c => x >= c.x && x <= c.x + c.w && y >= c.y && y <= c.y + c.h);
    if (c) { if (selIndex === c.k) hit.add('Enter'); else selIndex = c.k; } else hit.add('Enter');
    return;
  }
  if (scene !== 'play') { hit.add('Enter'); return; }
  const bs = touchButtons();
  for (const k in bs) {
    const b = bs[k];
    if (Math.hypot(x - b.x, y - b.y) < b.r * 1.25) {
      hit.add(b.code);
      if (k === 'attack') { touch.attack = true; touch.attackId = e.pointerId; }
      return;
    }
  }
  if (x < W * 0.55 && touch.joyId === null) { touch.joyId = e.pointerId; touch.ox = touch.x = x; touch.oy = touch.y = y; }
});
canvas.addEventListener('pointermove', e => {
  if (e.pointerId !== touch.joyId) return;
  const [x, y] = toLogical(e); const R0 = Math.min(W, H) * 0.1;
  let dx = x - touch.ox, dy = y - touch.oy; const l = Math.hypot(dx, dy);
  if (l > R0) { touch.ox = x - dx / l * R0; touch.oy = y - dy / l * R0; dx = x - touch.ox; dy = y - touch.oy; }
  touch.x = x; touch.y = y; touch.ax = dx / R0; touch.ay = dy / R0;
});
function endPointer(e) {
  if (e.pointerId === touch.joyId) { touch.joyId = null; touch.ax = touch.ay = 0; }
  if (e.pointerId === touch.attackId) { touch.attack = false; touch.attackId = null; }
}
canvas.addEventListener('pointerup', endPointer);
canvas.addEventListener('pointercancel', endPointer);

// ---- Audio: started on first input, mute on M --------------------------------------------
let audio = null, muted = false;
function startAudio() {
  if (!audio) {
    const ac = window.GAME_AUDIO || new (window.AudioContext || window.webkitAudioContext)();
    const out = ac.createGain(); out.gain.value = muted ? 0 : tune.volume;
    out.connect(ac.destination); audio = { ac, out, noise: null };
  }
  if (audio.ac.state === 'suspended') audio.ac.resume();
}
function setMuted(m) { muted = m; if (audio) audio.out.gain.value = m ? 0 : tune.volume; }
addEventListener('tune', () => setMuted(muted));
function tone(freq, dur, type = 'square', vol = 0.3) {
  if (!audio || muted) return;
  const t = audio.ac.currentTime, o = audio.ac.createOscillator(), g = audio.ac.createGain();
  o.type = type; o.frequency.value = freq;
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g).connect(audio.out); o.start(t); o.stop(t + dur);
}
function sweep(f1, f2, dur, type = 'sine', vol = 0.25) {
  if (!audio || muted) return;
  const t = audio.ac.currentTime, o = audio.ac.createOscillator(), g = audio.ac.createGain();
  o.type = type; o.frequency.setValueAtTime(f1, t); o.frequency.exponentialRampToValueAtTime(f2, t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g).connect(audio.out); o.start(t); o.stop(t + dur);
}
function crunch(dur, vol = 0.3, freq = 900) { // filtered noise: hits, cracks, crumbling stone
  if (!audio || muted) return;
  const ac = audio.ac;
  if (!audio.noise) {
    const b = ac.createBuffer(1, ac.sampleRate, ac.sampleRate), d = b.getChannelData(0);
    let s = 7; for (let i = 0; i < d.length; i++) { s = (s * 16807) % 2147483647; d[i] = s / 1073741823.5 - 1; }
    audio.noise = b;
  }
  const t = ac.currentTime, src = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
  src.buffer = audio.noise; f.type = 'lowpass'; f.frequency.value = freq;
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  src.connect(f).connect(g).connect(audio.out); src.start(t, 0, dur + 0.05);
}
const sfx = {
  swing: () => sweep(500, 220, 0.09, 'triangle', 0.12),
  hit: () => { crunch(0.12, 0.35, 1400); tone(150, 0.1, 'square', 0.15); },
  clank: () => { tone(1200, 0.08, 'square', 0.12); tone(1700, 0.12, 'triangle', 0.1); },
  bigHit: () => { crunch(0.25, 0.45, 700); sweep(220, 60, 0.25, 'square', 0.2); },
  crack: () => crunch(0.18, 0.3, 500),
  wood: () => { crunch(0.2, 0.35, 1100); tone(220, 0.08, 'square', 0.1); },
  tileFall: () => crunch(0.4, 0.18, 300),
  fall: () => sweep(700, 90, 0.9, 'triangle', 0.25),
  ko: () => { sweep(400, 80, 0.4, 'sawtooth', 0.18); crunch(0.3, 0.3, 900); },
  pickup: () => { tone(660, 0.07, 'square', 0.15); setTimeout(() => tone(990, 0.1, 'square', 0.15), 70); },
  special: () => sweep(180, 900, 0.25, 'sawtooth', 0.18),
  slam: () => { crunch(0.6, 0.55, 400); sweep(120, 40, 0.5, 'sine', 0.4); },
  whoosh: () => sweep(1200, 200, 0.6, 'sine', 0.12),
  boulder: () => { crunch(0.7, 0.6, 350); sweep(90, 35, 0.6, 'sine', 0.45); },
  warn: () => { tone(110, 0.25, 'sawtooth', 0.12); setTimeout(() => tone(110, 0.25, 'sawtooth', 0.12), 300); },
  beep: hi => tone(hi ? 880 : 440, 0.15, 'square', 0.2),
  select: () => tone(520, 0.06, 'square', 0.12),
  beat: () => { tone(70, 0.12, 'sine', 0.35); },
  win: () => [523, 659, 784, 1046].forEach((f, i) => setTimeout(() => tone(f, 0.2, 'square', 0.18), i * 120)),
  lose: () => [392, 330, 262].forEach((f, i) => setTimeout(() => tone(f, 0.25, 'triangle', 0.2), i * 180)),
};

// ---- Helpers --------------------------------------------------------------------------
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, k) => a + (b - a) * k;
const hash = (a, b, c = 0) => { let h = (a * 374761393 + b * 668265263 + c * 2246822519) | 0; h = Math.imul(h ^ (h >>> 13), 1274126177); return ((h ^ (h >>> 16)) >>> 0) / 4294967296; };
const angDiff = (a, b) => { let d = a - b; while (d > Math.PI) d -= 2 * Math.PI; while (d < -Math.PI) d += 2 * Math.PI; return d; };
function shade(hex, k) {
  const n = parseInt(hex.slice(1), 16); const r = n >> 16, g = (n >> 8) & 255, b = n & 255;
  const f = v => clamp(Math.round(k < 0 ? v * (1 + k) : v + (255 - v) * k), 0, 255);
  return `rgb(${f(r)},${f(g)},${f(b)})`;
}

// ---- The arena ------------------------------------------------------------------------
let R = 9, N = 19;
const TILT = 0.72;              // the camera's tilt: how much the floor's depth is squashed on screen
const tileIJ = (i, j) => (i < 0 || j < 0 || i >= N || j >= N) ? null : state.tiles[j * N + i];
const tileAt = (x, y) => tileIJ(Math.floor(x), Math.floor(y));
const standable = t => t && t.st < 2;
const solidAt = (x, y) => standable(tileAt(x, y));
const blockTile = t => standable(t) && t.ob;
const obstacleAt = (x, y) => !!blockTile(tileAt(x, y));
function damageTile(t, n) {
  if (!t || t.st !== 0 || n <= 0) return;
  t.hp -= n; t.hitT = 0.15;
  if (t.hp <= 0) { t.st = 1; t.t = tune.break_warn; t.broken = true; }
}
const breakable = t => t && t.ob && (t.ob.kind === 'crate' || t.ob.kind === 'barrel');
function hitCrate(t, n) {
  if (!breakable(t)) return false;
  t.ob.hp -= n; t.ob.flash = 0.12;
  burst(t.i + 0.5, t.j + 0.5, 4, '#c58a4a', 2, 'dust', 0.5);
  if (t.ob.hp <= 0) { // the crate bursts and leaves a potion or a gem
    t.ob = null; sfx.wood();
    burst(t.i + 0.5, t.j + 0.5, 14, '#b07436', 4, 'dust', 0.6);
    if (state.pickups.length < tune.pickup_max + 4) state.pickups.push({ x: t.i + 0.5, y: t.j + 0.5, kind: rng() < 0.55 ? 'potion' : 'gem', t: 0 });
  } else sfx.hit();
  return true;
}
function crackCircle(x, y, r, n) {
  let any = false;
  for (const t of state.tiles) {
    if (!t || t.st !== 0) continue;
    if (Math.hypot(t.i + 0.5 - x, t.j + 0.5 - y) <= r) { if (breakable(t)) hitCrate(t, 99); damageTile(t, n); any = true; }
  }
  if (any) sfx.crack();
}
const finalPhase = () => state.t >= tune.match_time - tune.final_window;
const progress = () => clamp(state.t / tune.match_time, 0, 1);
const fallingRing = () => R - state.ringNext; // the ring that falls next (and everything outside it)

// ---- Heroes and fighters ----------------------------------------------------------------
const WEAPONS = {
  sword:  { name: 'Espada',   dmg: 'sword_dmg',  knock: 'sword_knock',  cd: 'sword_cd',  reach: 'sword_reach',  arc: 2.0 },
  hammer: { name: 'Martillo', dmg: 'hammer_dmg', knock: 'hammer_knock', cd: 'hammer_cd', reach: 'hammer_reach', arc: 1.7 },
  spear:  { name: 'Lanza',    dmg: 'spear_dmg',  knock: 'spear_knock',  cd: 'spear_cd',  reach: 'spear_reach',  arc: 0.7 },
  bow:    { name: 'Arco',     dmg: 'bow_dmg',    knock: 'bow_knock',    cd: 'bow_cd',    reach: null,           arc: 0, ranged: true },
};
const HEROES = {
  knight: { name: 'Godofredo', role: 'Caballero', weapon: 'sword', hp: 'knight_hp', speed: 'knight_speed', ability: 'Torbellino',
    desc: ['Espada y escudo: el escudo', 'para los golpes de frente.'], adesc: ['Gira golpeando a todos y', 'agrieta el suelo a su alrededor.'], life: 3, spd: 2 },
  smith:  { name: 'Brunilda', role: 'Herrera', weapon: 'hammer', hp: 'smith_hp', speed: 'smith_speed', ability: 'Terremoto',
    desc: ['Martillo lento que lanza', 'muy lejos. La que más aguanta.'], adesc: ['Golpe al suelo que rompe', 'un círculo de baldosas.'], life: 4, spd: 1 },
  archer: { name: 'Elvira', role: 'Arquera', weapon: 'bow', hp: 'archer_hp', speed: 'archer_speed', ability: 'Lluvia de flechas',
    desc: ['Dispara de lejos. Rápida,', 'pero con poca vida.'], adesc: ['Flechas sobre una zona', 'lejana: agrieta el suelo.'], life: 1, spd: 4 },
  lancer: { name: 'Tancredo', role: 'Lancero', weapon: 'spear', hp: 'lancer_hp', speed: 'lancer_speed', ability: 'Embestida',
    desc: ['Lanza de gran alcance.', 'Equilibrado y rápido.'], adesc: ['Carga en línea recta,', 'arrolla y agrieta el suelo.'], life: 2, spd: 3 },
};
const HERO_KEYS = ['knight', 'smith', 'archer', 'lancer'];
const wv = (f, k) => tune[WEAPONS[f.weapon][k]];
const ROSTER = [ // you + seven bots, each with its own colour
  { name: 'TÚ', color: '#3fa9ff' }, { name: 'BOT Bruno', color: '#ff4d4d' }, { name: 'BOT Greta', color: '#ff9a3d' },
  { name: 'BOT Ulrico', color: '#b46bff' }, { name: 'BOT Mafalda', color: '#ff5fb0' }, { name: 'BOT Tristán', color: '#2fe0cf' },
  { name: 'BOT Olga', color: '#ffe14d' }, { name: 'BOT Baltasar', color: '#f2f2f2' },
];
let chosenHero = 'knight', selIndex = 0;
function makeFighter(k, x, y, hero) {
  const r = ROSTER[k], h = HEROES[hero];
  const maxHp = tune.hp * tune[h.hp];
  return { id: k, name: r.name, color: r.color, hero, bot: k !== 0, x, y, vx: 0, vy: 0, mx: 0, my: 0,
    face: Math.atan2(R + 0.5 - y, R + 0.5 - x), hp: maxHp, maxHp, weapon: h.weapon, cd: 0, swing: 0, special: 0,
    dodgeT: 0, dodgeCd: 0, dx: 0, dy: 0, alive: true, fall: 0, ko: 0, lastHit: -1, lastHitT: -99, kills: 0,
    flash: 0, squash: 0, spin: 0, charge: null, walk: 0, place: 0, block: 0,
    ai: { think: 0.2 + k * 0.05, target: -1, strafe: rng() < 0.5 ? 1 : -1, mood: 'fight', moodT: 0, rx: R + 0.5, ry: R + 0.5 } };
}
const alive = () => state.fighters.filter(f => f.alive);
const player = () => state.fighters[0];

// ---- Scenes ---------------------------------------------------------------------------
let scene, state;
function buildMap(tiles) { // walls, rocks and crates, the same in each quarter so no spawn is luckier
  const C = R, put = (dx, dy, kind) => {
    for (const [a, b] of [[dx, dy], [-dy, dx], [-dx, -dy], [dy, -dx]]) {
      const t = tiles[(C + b) * N + (C + a)];
      if (t && t.ring <= R - 1) t.ob = { kind, hp: tune.crate_hp, flash: 0 };
    }
  };
  [[2, 5], [3, 5], [3, 4]].forEach(([a, b]) => put(a, b, 'wall'));                 // corner forts, clear of the spawn points
  [[2, 7], [3, 7]].forEach(([a, b]) => put(a, b, 'wall'));                          // outer walls
  [[3, 9], [4, 9], [5, 8]].forEach(([a, b]) => put(a, b, 'wall'));                  // the far ruins
  [[7, 2], [2, -7], [9, -2]].forEach(([a, b]) => put(a, b, 'rock'));
  [[6, 3], [8, 4], [2, 10], [4, 1]].forEach(([a, b]) => put(a, b, 'tree'));
  [[2, 3], [5, -1], [1, 6], [7, -4]].forEach(([a, b]) => put(a, b, 'crate'));
  [[4, -2], [8, -6], [0, 4]].forEach(([a, b]) => put(a, b, 'barrel'));
}
function reset() {
  seed = Number(params.get('seed')) || CONFIG.seed;
  R = tune.arena_radius; N = 2 * R + 1;
  const tiles = [];
  for (let j = 0; j < N; j++) for (let i = 0; i < N; i++) {
    const ring = Math.round(Math.hypot(i - R, j - R));
    tiles.push(ring <= R ? { i, j, ring, hp: tune.tile_hp, st: 0, t: 0, hitT: 0, broken: false, ob: null } : null);
  }
  buildMap(tiles);
  const n = Math.max(0, R - tune.ring_keep), ringTimes = [];
  for (let k = 0; k < n; k++) { // the outside ring first, then each next one sooner after the last
    const u = n === 1 ? 0 : k / (n - 1);
    ringTimes.push(tune.ring_first + (tune.ring_last - tune.ring_first) * (1 - Math.pow(1 - u, tune.ring_curve)));
  }
  state = { t: 0, score: 0, gained: '', tiles, fighters: [], pickups: [], arrows: [], rains: [], boulders: [], parts: [], pops: [],
    feed: [], banner: null, ringNext: 0, ringTimes, potionT: tune.potion_every, crackT: 0, catT: 0, catSaid: false,
    cd: tune.countdown, cdLast: 99, ended: false, endT: 0, result: '', place: 0, winner: null, resT: 0, finalSaid: false, beatT: 0,
    safe: { x: R + 0.5, y: R + 0.5 }, safeT: 0, cam: { x: R + 0.5, y: R + 0.5, S: 48 }, shake: 0 };
  const count = tune.fighters;
  const pool = []; for (let k = 0; k < 8; k++) pool.push(HERO_KEYS[k % 4]);
  for (let k = pool.length - 1; k > 0; k--) { const m = Math.floor(rng() * (k + 1)); [pool[k], pool[m]] = [pool[m], pool[k]]; }
  for (let k = 0; k < count; k++) { // spread around inside the edge; you start at the front
    const a = Math.PI / 2 + k / count * Math.PI * 2, d = R - 1.8;
    const x = R + 0.5 + Math.cos(a) * d, y = R + 0.5 + Math.sin(a) * d;
    for (const t of tiles) if (t && t.ob && Math.hypot(t.i + 0.5 - x, t.j + 0.5 - y) < 1.4) t.ob = null;
    state.fighters.push(makeFighter(k, x, y, k === 0 ? chosenHero : pool[k]));
  }
  if (scene === 'play' || scene === 'select') followCamera(true); else fitCamera(true);
}

function banner(textS, color = '#fff', dur = 2) { state.banner = { text: textS, color, t: dur, dur }; }
function pop(x, y, s, color = '#fff', size = 1) { state.pops.push({ x, y, s, color, t: 0, size }); }
function feed(s) { state.feed.unshift({ s, t: 5 }); if (state.feed.length > 4) state.feed.pop(); }
function burst(x, y, n, color, speed = 3, kind = 'dust', z = 0.3) {
  for (let k = 0; k < n; k++) {
    const a = Math.random() * Math.PI * 2, s = speed * (0.4 + Math.random() * 0.8); // visual only: no gameplay randomness
    state.parts.push({ x, y, z, vx: Math.cos(a) * s, vy: Math.sin(a) * s, vz: 2 + Math.random() * 3, life: 0.5 + Math.random() * 0.4, t: 0, color, kind, size: 0.06 + Math.random() * 0.08 });
  }
}
function shake(a) { state.shake = Math.max(state.shake, a); }

// ---- Combat ---------------------------------------------------------------------------
function nearestEnemy(f, maxD = 1e9) {

    else { ctx.beginPath(); ctx.arc(sx, sy, r * (1.2 - k * 0.4), 0, 7); ctx.fill(); }
    ctx.globalAlpha = 1;
  }
  const vg = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.45, W / 2, H / 2, Math.max(W, H) * 0.75);
  vg.addColorStop(0, 'rgba(10,20,60,0)'); vg.addColorStop(1, 'rgba(10,20,60,0.35)');
  ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
  for (const p of state.pops) {
    const [sx, sy] = toS(p.x, p.y, 2.2 + p.t * 1.2), k = p.t / 0.8;
    ctx.globalAlpha = clamp(1.6 - k * 1.6, 0, 1);
    textO(p.s, sx, sy, S * 0.38 * p.size * (k < 0.15 ? 0.6 + k * 2.7 : 1), p.color);
    ctx.globalAlpha = 1;
  }
}

const PANEL = { base: ['#4a3d9a', '#2a2160'], red: ['#e0414f', '#8c1424'], sel: ['#7a55d6', '#3f2a8a'], dark: ['#2f2a5c', '#1c1840'] };
/** A glossy rounded panel: drop shadow, gradient, thick border, a shine along the top. */
function drawPanel(x, y, w, h, kind = 'base') {
  const [c1, c2] = PANEL[kind] || PANEL.base, r = Math.min(16, h * 0.25);
  ctx.fillStyle = 'rgba(10,8,30,0.45)'; rrect(x + 2, y + 5, w, h, r); ctx.fill();
  const g = ctx.createLinearGradient(0, y, 0, y + h); g.addColorStop(0, c1); g.addColorStop(1, c2);
  ctx.fillStyle = g; rrect(x, y, w, h, r); ctx.fill();
  ctx.strokeStyle = '#120e2a'; ctx.lineWidth = 4; ctx.stroke();
  ctx.fillStyle = 'rgba(255,255,255,0.16)'; rrect(x + 5, y + 4, w - 10, Math.min(h * 0.35, 22), r * 0.7); ctx.fill();
}
/** A rounded bar with a shine; frac 0..1. */
function glossBar(x, y, w, h, frac, color) {
  const r = h / 2;
  ctx.fillStyle = '#120e2a'; rrect(x - 2, y - 2, w + 4, h + 4, r + 2); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.12)'; rrect(x, y, w, h, r); ctx.fill();
  if (frac > 0) {
    const g = ctx.createLinearGradient(0, y, 0, y + h); g.addColorStop(0, shade(color, 0.35)); g.addColorStop(1, shade(color, -0.2));
    ctx.fillStyle = g; rrect(x, y, Math.max(h, w * clamp(frac, 0, 1)), h, r); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.35)'; rrect(x + r * 0.5, y + h * 0.15, Math.max(0, w * clamp(frac, 0, 1) - r), h * 0.28, h * 0.14); ctx.fill();
  }
}
function drawSkull(x, y, r) {
  ctx.fillStyle = '#f4ecd8'; ctx.strokeStyle = '#1a1430'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(x, y - r * 0.15, r, Math.PI * 0.85, Math.PI * 2.15); ctx.lineTo(x + r * 0.55, y + r * 0.85); ctx.lineTo(x - r * 0.55, y + r * 0.85); ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#1a1430'; ctx.beginPath(); ctx.arc(x - r * 0.38, y, r * 0.24, 0, 7); ctx.arc(x + r * 0.38, y, r * 0.24, 0, 7); ctx.fill();
}
function drawMinimap(x0, y0, m) {
  drawPanel(x0 - 6, y0 - 6, m + 12, m + 12, 'dark');
  const c = m / N;
  for (const t of state.tiles) {
    if (!t || t.st >= 2) continue;
    ctx.fillStyle = t.st === 1 ? '#ff5a4a' : t.ob ? (breakable(t) ? '#c58a4a' : t.ob.kind === 'tree' ? '#2f7d2a' : '#9aa0aa') : '#6cc046';
    ctx.fillRect(x0 + t.i * c, y0 + t.j * c, c + 0.5, c + 0.5);
  }
  for (const b of state.boulders) { ctx.strokeStyle = '#ff3b2f'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(x0 + b.x * c, y0 + b.y * c, c * 1.2, 0, 7); ctx.stroke(); }
  for (const f of state.fighters) {
    if (!f.alive) continue;
    ctx.fillStyle = f.id === 0 ? '#ffe14d' : f.color; ctx.strokeStyle = '#1a1430'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(x0 + f.x * c, y0 + f.y * c, f.id === 0 ? c * 0.9 : c * 0.6, 0, 7); ctx.fill(); ctx.stroke();
  }
}
function drawHUD() {
  const u = Math.min(W, H) / 720, p = player(), h = HEROES[p.hero];
  // Timer and who is left, top centre.
  const left = Math.max(0, tune.match_time - state.t), m = Math.floor(left / 60), s = Math.floor(left % 60);
  const fin = finalPhase() && !state.ended;
  const tx = portrait ? W / 2 + 40 * u : W / 2;
  drawPanel(tx - 100 * u, 10 * u, 200 * u, 88 * u, fin ? 'red' : 'base');
  textO(`${m}:${String(s).padStart(2, '0')}`, tx, 42 * u, (fin ? 42 + 4 * Math.abs(Math.sin(state.t * 6)) : 38) * u, fin ? '#ffdddd' : '#fff');
  drawSkull(tx - 50 * u, 77 * u, 9 * u);
  textO(`Quedan ${alive().length}`, tx + 10 * u, 78 * u, 19 * u, '#ffe14d');
  // You: hero, life, ability meter.
  const px = 12 * u, py = 10 * u, pw = portrait ? 230 * u : 320 * u;
  drawPanel(px, py, pw, 100 * u);
  ctx.save(); ctx.beginPath(); ctx.rect(px + 4, py + 4, 64 * u, 92 * u); ctx.clip();
  drawHero(p, px + 36 * u, py + 128 * u, 120 * u, true); ctx.restore();
  textO(`${h.name} · ${h.role}`, px + 76 * u, py + 20 * u, 16 * u, '#fff', 'left');
  const bw = pw - 88 * u;
  glossBar(px + 76 * u, py + 36 * u, bw, 16 * u, p.hp / p.maxHp, '#5fe05a');
  textO(`${Math.ceil(p.hp)}`, px + 76 * u + bw / 2, py + 44 * u, 13 * u, '#fff');
  const ready = p.special >= 100;
  glossBar(px + 76 * u, py + 60 * u, bw, 18 * u, p.special / 100, ready ? (Math.sin(clock.now() * 10) > 0 ? '#ffd23f' : '#ff9f1c') : '#ffb43d');
  textO(ready ? `¡${h.ability.toUpperCase()}! (K)` : h.ability, px + 76 * u + bw / 2, py + 69 * u, 14 * u, ready ? '#fff' : '#ffe9c7');
  textO(`Eliminaciones: ${p.kills}`, px + 76 * u, py + 90 * u, 13 * u, '#cfd8ff', 'left');
  // Minimap top right, the kill feed under it.
  const mm = (portrait ? 130 : 150) * u, mx = W - mm - 14 * u, my = 14 * u;
  drawMinimap(mx, my, mm);
  state.feed.forEach((fd, k) => {
    ctx.globalAlpha = clamp(fd.t, 0, 1);
    textO(fd.s, W - 14 * u, my + mm + 26 * u + k * 24 * u, 15 * u, '#fff', 'right');
    ctx.globalAlpha = 1;
  });
  // Countdown and banners.
  if (state.cd > 0) {
    const n = Math.ceil(state.cd), k = state.cd - Math.floor(state.cd);
    textO(String(n), W / 2, H / 2, (120 + 60 * k) * u, '#ffe14d');
    textO('¡Rompe cajas, usa tu habilidad, tira a todos al vacío!', W / 2, H / 2 + 110 * u, 22 * u, '#fff');
  }
  if (state.banner) {
    const b = state.banner, k = 1 - b.t / b.dur, sc = k < 0.12 ? 0.5 + k * 4.2 : 1;
    ctx.globalAlpha = clamp(b.t * 2, 0, 1);
    textO(b.text, W / 2, H * 0.24 + 40 * u, 58 * u * sc, b.color);
    ctx.globalAlpha = 1;
  }
  if (!touch.on && state.t < 12 && state.cd <= 0) textO('J / Espacio: atacar   ·   K: habilidad   ·   L: esquivar', W / 2, H - 24 * u, 18 * u, '#fff');
}
function drawTouch() {
  const bs = touchButtons(), u = Math.min(W, H) / 720;
  if (touch.joyId !== null) {
    ctx.fillStyle = 'rgba(255,255,255,0.18)'; ctx.strokeStyle = 'rgba(255,255,255,0.6)'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(touch.ox, touch.oy, Math.min(W, H) * 0.1, 0, 7); ctx.fill(); ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,0.7)'; ctx.beginPath(); ctx.arc(touch.x, touch.y, Math.min(W, H) * 0.045, 0, 7); ctx.fill();
  } else textO('desliza para moverte', W * 0.2, H - 40 * u, 16 * u, 'rgba(255,255,255,0.8)');
  const p = player();
  for (const k in bs) {
    const b = bs[k];
    const col = k === 'special' ? (p.special >= 100 ? '#ffb43d' : 'rgba(120,100,60,0.6)') : k === 'attack' ? 'rgba(255,80,70,0.75)' : 'rgba(60,140,255,0.7)';
    ctx.fillStyle = 'rgba(10,8,30,0.4)'; ctx.beginPath(); ctx.arc(b.x + 2, b.y + 5, b.r, 0, 7); ctx.fill();
    ctx.fillStyle = col; ctx.strokeStyle = '#120e2a'; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, 7); ctx.fill(); ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,0.3)'; ctx.beginPath(); ctx.ellipse(b.x, b.y - b.r * 0.45, b.r * 0.65, b.r * 0.3, 0, 0, 7); ctx.fill();
    textO(b.label, b.x, b.y, (k === 'pause' ? 18 : 14) * u, '#fff');
  }
}

function drawTitle() {
  setCam(); drawSky();
  const u = Math.min(W, H) / 720;
  for (let j = 0; j < N; j++) for (let i = 0; i < N; i++) { const t = tileIJ(i, j); if (t && t.st < 2) drawTile(t); }
  const items = [];
  for (const t of state.tiles) if (t && t.ob) items.push({ y: t.j + 0.98, t });
  for (const f of state.fighters) items.push({ y: f.y, f });
  items.sort((a, b) => a.y - b.y);
  for (const it of items) {
    if (it.t) { const [sx, sy] = toS(it.t.i, it.t.j); drawObstacleAt(it.t, sx, sy, camS); }
    else { const [sx, sy] = toS(it.f.x, it.f.y); drawHero(it.f, sx, sy, camS * 1.4, true); }
  }
  ctx.fillStyle = 'rgba(16,12,40,0.45)'; ctx.fillRect(0, 0, W, H);
  textO(TITLE, W / 2, H * 0.18, 96 * u, '#ffe14d');
  textO('4 héroes · 8 guerreros · 1 arena que se cae · 5 minutos', W / 2, H * 0.18 + 68 * u, 24 * u, '#fff');
  CONTROLS.forEach((c, i) => textO(c, W / 2, H * 0.44 + i * 34 * u, 20 * u, '#e8f0ff'));
  textO('Juegas tú contra 7 bots', W / 2, H * 0.44 + CONTROLS.length * 34 * u + 8 * u, 18 * u, '#ffd23f');
  const k = 1 + Math.sin(clock.now() * 4) * 0.05;
  textO('ENTER O TOCA PARA EMPEZAR', W / 2, H - 56 * u, 32 * u * k, '#ffffff');
}
function drawSelect() {
  clear('#2a4f9e'); drawSky();
  ctx.fillStyle = 'rgba(16,12,40,0.35)'; ctx.fillRect(0, 0, W, H);
  const u = Math.min(W, H) / 720;
  textO('ELIGE TU HÉROE', W / 2, 46 * u, 46 * u, '#ffe14d');
  const cols = portrait ? 2 : 4, rows = 4 / cols;
  const gap = 14 * u, cw = (W - gap * (cols + 1)) / cols, ch = Math.min(portrait ? 520 * u : 560 * u, (H - 150 * u - gap * (rows - 1)) / rows);
  cardRects = [];
  HERO_KEYS.forEach((key, k) => {
    const h = HEROES[key], cx = gap + (k % cols) * (cw + gap), cy = 86 * u + Math.floor(k / cols) * (ch + gap), sel = k === selIndex;
    cardRects.push({ x: cx, y: cy, w: cw, h: ch, k });
    drawPanel(cx, cy, cw, ch, sel ? 'sel' : 'base');
    if (sel) { ctx.strokeStyle = '#ffe14d'; ctx.lineWidth = 5; ctx.beginPath(); ctx.roundRect ? ctx.roundRect(cx, cy, cw, ch, 12) : ctx.rect(cx, cy, cw, ch); ctx.stroke(); }
    const s = Math.min(cw * 0.55, ch * 0.34), bob = sel ? Math.sin(clock.now() * 5) * 4 * u : 0;
    const fake = { hero: key, color: ROSTER[0].color, face: 0, hp: 1, maxHp: 1, weapon: h.weapon, swing: 0, squash: 0, walk: 0, spin: 0, flash: 0, block: 0, dodgeT: 0 };
    ctx.fillStyle = 'rgba(120,202,73,0.9)'; ctx.beginPath(); ctx.ellipse(cx + cw / 2, cy + ch * 0.46, s * 0.55, s * 0.17, 0, 0, 7); ctx.fill();
    drawHero(fake, cx + cw / 2 - s * 0.05, cy + ch * 0.46 + bob, s, true);
    let ty = cy + ch * 0.53;
    textO(h.name, cx + cw / 2, ty, 24 * u, sel ? '#ffe14d' : '#fff'); ty += 26 * u;
    textO(h.role, cx + cw / 2, ty, 16 * u, '#cfd8ff'); ty += 28 * u;
    const bar = (label, n) => {
      textO(label, cx + 16 * u, ty, 13 * u, '#fff', 'left');
      for (let q = 0; q < 4; q++) { ctx.fillStyle = q < n ? '#ffcf3d' : 'rgba(255,255,255,0.18)'; ctx.fillRect(cx + cw * 0.48 + q * (cw * 0.11), ty - 6 * u, cw * 0.09, 12 * u); }
      ty += 20 * u;
    };
    bar('Vida', h.life); bar('Velocidad', h.spd);
    ty += 6 * u;
    h.desc.forEach(l => { textO(l, cx + cw / 2, ty, 13 * u, '#e8f0ff'); ty += 18 * u; });
    ty += 8 * u;
    textO(`Habilidad: ${h.ability}`, cx + cw / 2, ty, 15 * u, '#ffb43d'); ty += 20 * u;
    h.adesc.forEach(l => { textO(l, cx + cw / 2, ty, 13 * u, '#ffe9c7'); ty += 18 * u; });
  });
  textO(touch.on ? 'Toca un héroe, y otra vez para empezar' : '← → elegir   ·   Enter: ¡a la arena!', W / 2, H - 26 * u, 20 * u, '#fff');
}
function drawFigures() {
  drawSky();
  const u = Math.min(W, H) / 720;
  textO('Héroes y objetos', W / 2, 30 * u, 28 * u, '#fff');
  const s = 120 * u;
  HERO_KEYS.forEach((key, k) => {
    const x = W / 4 * (k + 0.5), y = 230 * u;
    const fake = { hero: key, color: ROSTER[k * 2].color, face: 0, hp: 1, maxHp: 1, weapon: HEROES[key].weapon, swing: 0, squash: 0, walk: 0, spin: 0, flash: 0, block: 0, dodgeT: 0 };
    ctx.fillStyle = '#78ca49'; ctx.beginPath(); ctx.ellipse(x, y, s * 0.6, s * 0.2, 0, 0, 7); ctx.fill();
    drawHero(fake, x, y, s, true);
    textO(HEROES[key].name, x, y + 30 * u, 20 * u, fake.color);
    textO(`${HEROES[key].role} · ${HEROES[key].ability}`, x, y + 54 * u, 14 * u, '#fff');
  });
  const props = [{ ob: { kind: 'wall', hp: 1, flash: 0 }, n: 'Muro' }, { ob: { kind: 'rock', hp: 1, flash: 0 }, n: 'Roca' }, { ob: { kind: 'tree', hp: 1, flash: 0 }, n: 'Árbol' },
    { ob: { kind: 'crate', hp: 3, flash: 0 }, n: 'Caja' }, { ob: { kind: 'barrel', hp: 3, flash: 0 }, n: 'Barril' },
    { pk: 'potion', n: 'Poción' }, { pk: 'gem', n: 'Gema' }, { boulder: true, n: 'Catapulta' }];
  const S = 70 * u;
  props.forEach((p, k) => {
    const x = W / props.length * (k + 0.5), y = 470 * u;
    if (p.ob) drawObstacleAt({ i: 0, j: 0, ob: p.ob }, x - S / 2, y - S * TILT, S);
    else if (p.pk) drawPickup(p.pk, x, y, S);
    else drawBoulder(x, y - S * 0.4, S * 0.9, 0.3);
    textO(p.n, x, y + 36 * u, 16 * u, '#fff');
  });
}

// ---- Loop: fixed step, frame time clamped ---------------------------------------------
function step() {
  if (pressed('KeyM')) { setMuted(!muted); hit.delete('KeyM'); }
  scenes[scene].update(STEP); hit.clear();
}
let last, acc = 0, ALPHA = 1;
function tick() {
  const now = clock.now();
  acc += Math.min(now - last, 0.25); last = now;
  while (acc >= STEP) { step(); acc -= STEP; }
  ALPHA = acc / STEP;
  drawFrame();
}
function drawFrame() { scenes[scene].draw(); }
function frame() { tick(); requestAnimationFrame(frame); }
function timer() { if (document.visibilityState === 'visible' && clock.now() - last > 0.1) tick(); }

// ---- What a check can read and drive (?manual=1 stops the loop; players never see it) ----
window.game = {
  get scene() { return scene; },
  get state() { return state; },
  press(code) { hit.add(code); },
  hold(code, on) { on ? down.add(code) : down.delete(code); },
  get events() { return events; },
  step(n = 1, draw = true, alpha = 1) {
    for (let i = 0; i < n; i++) step();
    if (draw) { ALPHA = alpha; drawFrame(); }
  },
};

scene = params.get('scene') || 'title';
reset();
last = clock.now();
if (params.get('manual') === '1') drawFrame();
else { requestAnimationFrame(frame); setInterval(timer, 50); }
</script>
