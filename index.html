`,use:[0,99],wind:.8,rest:1.2,speed:7,life:2,count:8,spread:.4,color:`#e0a8ff`},{k:`nova`,use:[0,3.4],wind:.9,rest:1.2,radius:3.2,mult:1.3,color:`#c06bff`},{k:`summon`,use:[0,99],wind:.8,rest:1.6,kind:`shade`,count:2,cap:4}]}},Ae=`Tomasa`,je={intro:[{who:`narrator`,text:`Hace mucho tiempo, las islas flotaban tranquilas sobre el Abismo.`},{who:`narrator`,text:`Pero algo, allá abajo, ha empezado a tirar de ellas. Cada día se hunde un trozo más.`},{who:`mentor`,text:`¡Por fin llegas, {hero}! Soy Tomasa, y este campamento es lo último que queda en pie de la Pradera.`},{who:`mentor`,text:`Dicen que en el cráter del Volcán duerme el Dragón de lava, y que su corazón es lo que arrastra las islas al vacío.`},{who:`mentor`,text:`Cinco tierras, cinco guardianes. Vence a cada uno y llévate su ancla de piedra: con las cinco, el suelo dejará de caer.`},{who:`hero`,text:`Pues habrá que ir. ¿Por dónde empiezo?`},{who:`mentor`,text:`Por los slimes de ahí fuera. Y si encuentras oro, pásate por mi tienda: tengo pociones y algún trasto útil.`}],boss0:[{who:`king_slime`,text:`¡Blup! ¿Quién osa chapotear en el charco real?`},{who:`hero`,text:`Vengo a por tu ancla de piedra, majestad.`},{who:`king_slime`,text:`¡Mi ancla es mi corona! Y mi corona es... ¡blup!... ¡MÍA!`}],after0:[{who:`mentor`,text:`¡La primera ancla! Mira: el suelo de la Pradera ha dejado de temblar.`},{who:`mentor`,text:`El camino sigue por el Desierto. Llévate agua... y ganas de pelear.`}],boss1:[{who:`narrator`,text:`La arena tiembla. Algo enorme se mueve bajo tus pies.`},{who:`worm`,text:`Llevo mil años durmiendo bajo estas dunas. Mil años sin postre.`},{who:`hero`,text:`Yo no soy un postre.`},{who:`worm`,text:`Eso ya lo veremos.`}],after1:[{who:`mentor`,text:`Dos anclas. Ese gusano no volverá a tragarse a nadie.`},{who:`mentor`,text:`Ahora toca el Bosque otoñal. Dicen que allí los árboles escuchan... y se acuerdan de todo.`}],boss2:[{who:`ent`,text:`Hrrrm... Cada hoja que cae es una isla que se pierde.`},{who:`hero`,text:`Entonces ayúdame a pararlo.`},{who:`ent`,text:`El ancla echó raíces en mi corazón. Si la quieres... tendrás que arrancarla.`}],after2:[{who:`mentor`,text:`El viejo Ent te ha dado su ancla. Creo que, en el fondo, quería que alguien lo liberase.`},{who:`mentor`,text:`Abrígate, {hero}: la Tundra helada es la siguiente.`}],boss3:[{who:`narrator`,text:`Un bloque de hielo del tamaño de una casa se levanta despacio.`},{who:`golem`,text:`INTRUSO DETECTADO. TEMPERATURA: DEMASIADO ALTA.`},{who:`hero`,text:`Gracias, me lo dicen mucho.`},{who:`golem`,text:`ENFRIANDO INTRUSO.`}],after3:[{who:`mentor`,text:`¡Cuatro anclas! Siento el calor del Volcán desde aquí. El Dragón ya sabe que vas a por él.`},{who:`mentor`,text:`Cuando quieras, ve. Yo guardaré el campamento... y la tienda.`}],boss4:[{who:`narrator`,text:`El cráter ruge. Las rocas caen hacia arriba, hacia el cielo rojo.`},{who:`dragon`,text:`Así que tú eres quien va recogiendo mis anclas, {hero}.`},{who:`hero`,text:`Y tú eres quien hunde las islas.`},{who:`dragon`,text:`El Abismo tiene hambre. Yo solo le doy de comer. ¿Quieres ser el plato principal?`},{who:`hero`,text:`Prefiero ser quien apaga el fogón.`}],after4:[{who:`narrator`,text:`El corazón del Dragón se apaga con un último suspiro de humo.`},{who:`dragon`,text:`Qué ingenuidad... yo solo era su perro guardián. El Abismo... ya está despierto.`},{who:`narrator`,text:`Las cinco anclas brillan a la vez y las islas dejan de caer. Pero el suelo del cráter se abre, y una escalera de piedra baja hacia la oscuridad.`},{who:`mentor`,text:`¡{hero}! Las anclas aguantan, pero algo tira desde abajo con más fuerza que nunca.`},{who:`mentor`,text:`Bajo el Volcán están las tierras de abajo: el Pantano, las Cavernas, las Ruinas, las Cumbres... y al fondo, el Corazón del Abismo.`},{who:`hero`,text:`Pues habrá que bajar. Guárdame unas pociones.`},{who:`mentor`,text:`Ahí abajo todo pega más fuerte. Mejora tu equipo antes de cada guardián, y no te avergüences de repetir combates.`}],b
