n't accept the request`,"No se pudo conectar con el servidor. Si nadie jugaba hace rato, tarda hasta un minuto en despertar: prueba otra vez.":`Couldn't connect to the server. If nobody has played for a while, it takes up to a minute to wake up: try again.`,"No se pudo conectar con el servidor":`Couldn't connect to the server`,"Se perdió la conexión con el servidor":`The connection to the server was lost`,"No existe ninguna sala con ese código":`There is no room with that code`,"La sala está llena (# jugadores)":`The room is full (# players)`,"Hay una versión nueva del juego: recarga la página":`There is a new version of the game: reload the page`,"LA SENDA DEL ABISMO · {0}":`THE PATH OF THE ABYSS · {0}`,"toca para seguir":`tap to go on`,"Enter: seguir · Esc: saltar":`Enter: go on · Esc: skip`,"Hace mucho tiempo, las islas flotaban tranquilas sobre el Abismo.":`Long ago, the islands floated peacefully above the Abyss.`,"Pero algo, allá abajo, ha empezado a tirar de ellas. Cada día se hunde un trozo más.":`But something down there has started pulling at them. Every day another piece sinks.`,"¡Por fin llegas, {hero}! Soy Tomasa, y este campamento es lo último que queda en pie de la Pradera.":`At last you're here, {hero}! I'm Tomasa, and this camp is all that's left standing in the Meadow.`,"Dicen que en el cráter del Volcán duerme el Dragón de lava, y que su corazón es lo que arrastra las islas al vacío.":`They say the Lava Dragon sleeps in the Volcano's crater, and that its heart is what drags the islands into the void.`,"Cinco tierras, cinco guardianes. Vence a cada uno y llévate su ancla de piedra: con las cinco, el suelo dejará de caer.":`Five lands, five guardians. Beat each one and take its stone anchor: with all five, the ground will stop falling.`,"Pues habrá que ir. ¿Por dónde empiezo?":`Then I guess I have to go. Where do I start?`,"Por los slimes de ahí fuera. Y si encuentras oro, pásate por mi tienda: tengo pociones y algún trasto útil.":`With the slimes out there. And if you find gold, drop by my shop: I have potions and a few handy things.`,"¡Blup! ¿Quién osa chapotear en el charco real?":`Blub! Who dares splash in the royal puddle?`,"Vengo a por tu ancla de piedra, majestad.":`I've come for your stone anchor, Your Majesty.`,"¡Mi ancla es mi corona! Y mi corona es... ¡blup!... ¡MÍA!":`My anchor is my crown! And my crown is... blub!... MINE!`,"¡La primera ancla! Mira: el suelo de la Pradera ha dejado de temblar.":`The first anchor! Look: the Meadow has stopped shaking.`,"El camino sigue por el Desierto. Llévate agua... y ganas de pelear.":`The path goes on through the Desert. Take water... and a will to fight.`,"La arena tiembla. Algo enorme se mueve bajo tus pies.":`The sand trembles. Something huge moves under your feet.`,"Llevo mil años durmiendo bajo estas dunas. Mil años sin postre.":`I've slept under these dunes for a thousand years. A thousand years without dessert.`,"Yo no soy un postre.":`I'm not dessert.`,"Eso ya lo veremos.":`We'll see about that.`,"Dos anclas. Ese gusano no volverá a tragarse a nadie.":`Two anchors. That worm won't swallow anyone again.`,"Ahora toca el Bosque otoñal. Dicen que allí los árboles escuchan... y se acuerdan de todo.":`Next is the Autumn Forest. They say the trees there listen... and remember everything.`,"Hrrrm... Cada hoja que cae es una isla que se pierde.":`Hrrrm... Every falling leaf is an island lost.`,"Entonces ayúdame a pararlo.":`Then help me stop it.`,"El ancla echó raíces en mi corazón. Si la quieres... tendrás que arrancarla.":`The anchor took root in my heart. If you want it... you'll have to pull it out.`,"El viejo Ent te ha dado su ancla. Creo que, en el fondo, quería que alguien lo liberase.":`The old Ent gave you its anchor. I think, deep down, it wanted someone to set it free.`,"Abrígate, {hero}: la Tundra helada es la siguiente.":`Wrap up warm, {hero}: the Frozen Tundra is next.`,"Un bloque de hielo del tamaño de una casa se levanta despacio.":`A block of ice the size of a house slowly rises.`,"INTRUSO DETECTADO. TEMPERATURA: DEMASIADO ALTA.":`INTRUDER DETECTED. TEMPERATURE: TOO HIGH.`,"Gracias, me lo dicen mucho.":`Thanks, I hear that a lot.`,"ENFRIANDO INTRUSO.":`COOLING INTRUDER.`,"¡Cuatro anclas! Siento el calor del Volcán desde aquí. El Dragón ya sabe que vas a por él.":`Four anchors! I can feel the Volcano's heat from here. The Dragon knows you're coming.`,"Cuando quieras, ve. Yo guardaré el campamento... y la tienda.":`Go whenever you're ready. I'll guard the camp... and the shop.`,"El cráter ruge. Las rocas caen hacia arriba, hacia el cielo rojo.":`The crater roars. Rocks fall upwards, into the red sky.`,"Así que tú eres quien va recogiendo mis anclas, {hero}.":`So you're the one collecting my anchors, {hero}.`,"Y tú eres quien hunde las islas.":`And you're the one sinking the islands.`,"El Abismo tiene hambre. Yo solo le doy de comer. ¿Quieres ser el plato principal?":`The Abyss is hungry. I just feed it. Want to be the main course?`,"Prefiero ser quien apaga el fogón.":`I'd rather be the one who turns off the stove.`,"El corazón del Dragón se apaga con un último suspiro de humo.":`The Dragon's heart goes out with a last puff of smoke.`,"Qué ingenuidad... yo solo era su perro guardián. El Abismo... ya está despierto.":`How naive... I was only its watchdog. The Abyss... is already awake.`,"Las cinco anclas brillan a la vez y las islas dejan de caer. Pero el suelo del cráter se abre, y una escalera de piedra baja hacia la oscuridad.":`The five anchors glow together and the islands stop falling. But the crater's floor opens, and a stone stairway leads down into the dark.`,"¡{hero}! Las anclas aguantan, pero algo tira desde abajo con más fuerza que nunca.":`{hero}! The anchors hold, but something below pulls harder than ever.`,"Bajo el Volcán están las tierras de abajo: el Pantano, las Cavernas, las Ruinas, las Cumbres... y al fondo, el Corazón del Abismo.":`Under the Volcano lie the lower lands: the Swamp, the Caverns, the Ruins, the Peaks... and at the bottom, the Heart of the Abyss.`,"Pues habrá que bajar. Guárdame unas pociones.":`Then down I go. Save me some potions.`,"Ahí abajo todo pega más fuerte. Mejora tu equipo antes de cada guardián, y no te avergüences de repetir combates.":`Down there everything hits harder. Upgrade your gear before each guardian, and don't be shy about replaying battles.`,"El agua negra burbujea. Cinco cuellos se alzan a la vez.":`The black water bubbles. Five necks rise at once.`,"¿Otro héroe? Qué bien. Cada una de mis cabezas tenía hambre.":`Another hero? How lovely. Every one of my heads was hungry.`,"¿Y cuál de ellas manda?":`And which one is in charge?`,"¡YO! ¡No, YO! ¡Callaos todas y muérdelo!":`ME! No, ME! Shut up, all of you, and bite it!`,"La Hidra ya no discutirá con nadie. Bien hecho.":`The Hydra won't argue with anyone again. Well done.`,"Ahora, las Cavernas de cristal. Brillan muy bonito... y cortan muy feo.":`Now, the Crystal Caverns. They shine beautifully... and cut horribly.`,"Mis hijos me han hablado de ti. Pisas muy fuerte para caber en una de mis patas, {hero}.":`My children told me about you. You stomp very hard for someone who fits in one of my legs, {hero}.`,"Tus hijos muerden demasiado.":`Your children bite too much.`,"Han salido a su madre. No te muevas: esto solo dolerá muchísimo.":`They take after their mother. Hold still: this will only hurt a whole lot.`,"Sin su reina, las cavernas se han quedado en silencio. Hasta los cristales parecen respirar.":`Without their queen, the caverns have gone quiet. Even the crystals seem to breathe.`,"Más abajo están las Ruinas malditas. Allí los muertos no descansan... por culpa de alguien.":`Further down are the Cursed Ruins. The dead don't rest there... because of someone.`,"Las velas del altar se encienden solas, con una llama verde.":`The altar's candles light by themselves, with a green flame.`,"Te doy la bienvenida, {hero}. Siempre me faltan huesos para mi ejército.":`Welcome, {hero}. I never have enough bones for my army.`,"Los míos están ocupados. Búscate otros.":`Mine are busy. Find some others.`,"Todos dicen eso. Al final, todos acaban trabajando para mí.":`They all say that. In the end, they all end up working for me.`,"Los esqueletos han caído como fichas de dominó. Esas ruinas por fin descansan.":`The skeletons fell like dominoes. Those ruins finally rest.`,"Te quedan las Cumbres de la tormenta. Agárrate fuerte: allí el viento quiere tirarte al vacío.":`The Storm Peaks are left. Hold on tight: up there the wind wants to throw you into the void.`,"Un relámpago parte el cielo en dos. Algo enorme planea entre las nubes.":`Lightning splits the sky in two. Something huge glides among the clouds.`,"Nadie ha subido nunca hasta mi nido. Nadie ha bajado nunca de él.":`Nobody has ever climbed up to my nest. Nobody has ever come back down.`,"Siempre hay una primera vez.":`There's always a first time.`,"Y una última.":`And a last one.`,"Cuatro guardianes de abajo. Solo queda el fondo, {hero}: el Corazón del Abismo.":`Four guardians below. Only the bottom is left, {hero}: the Heart of the Abyss.`,"Es lo que arrastra las islas desde el principio. Si lo apagas, se acabó para siempre. Ve con todo lo que tengas.":`It's what has been dragging the islands from the start. Put it out and it's over for good. Go with everything you've got.`,"No hay suelo, ni cielo. Solo un latido enorme, que hace temblar todo lo que existe.":`No ground, no sky. Only a huge heartbeat that shakes everything there is.`,"TAN POCA COSA. TAN CÁLIDA. HAS APAGADO A MIS GUARDIANES UNO A UNO.":`SO SMALL. SO WARM. YOU HAVE PUT OUT MY GUARDIANS ONE BY ONE.`,"Y tú eres el último.":`And you're the last.`,"YO SOY EL FONDO DE TODO. TODO CAE HACIA MÍ. TAMBIÉN TÚ.":`I AM THE BOTTOM OF EVERYTHING. EVERYTHING FALLS TOWARDS ME. YOU TOO.`,"Hoy no.":`Not today.`,"El latido se detiene. Por primera vez en mil años, el Abismo calla.":`The heartbeat stops. For the first time in a thousand years, 5],wind:.5,rest:.9,speed:12,time:.4,daze:.9},{k:`swing`,use:[0,1.2],wind:.45,rest:.8,reach:.95,arc:1.8,mult:1.1}]},eye:{name:`Ojo del Abismo`,hp:115,dmg:13,knock:6,speed:1.8,weight:1,color:`#c06bff`,dark:`#4a1a7a`,size:1,xp:23,gold:14,move:`walk`,keep:5,attacks:[{k:`shot`,use:[2,8],wind:.65,rest:1.5,speed:8,life:1.2,count:4,spread:.25,mult:.8,color:`#e0a8ff`},{k:`mark`,use:[0,99],wind:.5,rest:1.6,count:1,radius:1.1,delay:1,color:`#c06bff`}]},abyss:{name:`Corazón del Abismo`,hp:1050,dmg:16,knock:12,speed:0,weight:.05,color:`#8a2ad8`,dark:`#22083a`,size:2.6,xp:600,gold:450,move:`still`,keep:0,boss:!0,attacks:[{k:`mark`,use:[0,99],wind:.6,rest:1.1,count:5,radius:1.15,delay:1,color:`#c06bff`},{k:`shot`,use:[0,99],wind:.8,rest:1.2,speed:7,life:2,count:8,spread:.4,color:`#e0a8ff`},{k:`nova`,use:[0,3.4],wind:.9,rest:1.2,radius:3.2,mult:1.3,color:`#c06bff`},{k:`summon`,use:[0,99],wind:.8,rest:1.6,kind:`shade`,count:2,cap:4}]}},af=`Tomasa`,of={intro:[{who:`narrator`,text:`Hace mucho tiempo, las islas flotaban tranquilas sobre el Abismo.`},{who:`narrator`,text:`Pero algo, allá abajo, ha empezado a tirar de ellas. Cada día se hunde un trozo más.`},{who:`mentor`,text:`¡Por fin llegas, {hero}! Soy Tomasa, y este campamento es lo último que queda en pie de la Pradera.`},{who:`mentor`,text:`Dicen que en el cráter del Volcán duerme el Dragón de lava, y que su corazón es lo que arrastra las islas al vacío.`},{who:`mentor`,text:`Cinco tierras, cinco guardianes. Vence a cada uno y llévate su ancla de piedra: con las cinco, el suelo dejará de caer.`},{who:`hero`,text:`Pues habrá que ir. ¿Por dónde empiezo?`},{who:`mentor`,text:`Por los slimes de ahí fuera. Y si encuentras oro, pásate por mi tienda: tengo pociones y algún trasto útil.`}],boss0:[{who:`king_slime`,text:`¡Blup! ¿Quién osa chapotear en el charco real?`},{who:`hero`,text:`Vengo a por tu ancla de piedra, majestad.`},{who:`king_slime`,text:`¡Mi ancla es mi corona! Y mi corona es... ¡blup!... ¡MÍA!`}],after0:[{who:`mentor`,text:`¡La primera ancla! Mira: el suelo de la Pradera ha dejado de temblar.`},{who:`mentor`,text:`El camino sigue por el Desierto. Llévate agua... y ganas de pelear.`}],boss1:[{who:`narrator`,text:`La arena tiembla. Algo enorme se mueve bajo tus pies.`},{who:`worm`,text:`Llevo mil años durmiendo bajo estas dunas. Mil años sin postre.`},{who:`hero`,text:`Yo no soy un postre.`},{who:`worm`,text:`Eso ya lo veremos.`}],after1:[{who:`mentor`,text:`Dos anclas. Ese gusano no volverá a tragarse a nadie.`},{who:`mentor`,text:`Ahora toca el Bosque otoñal. Dicen que allí los árboles escuchan... y se acuerdan de todo.`}],boss2:[{who:`ent`,text:`Hrrrm... Cada hoja que cae es una isla que se pierde.`},{who:`hero`,text:`Entonces ayúdame a pararlo.`},{who:`ent`,text:`El ancla echó raíces en mi corazón. Si la quieres... tendrás que arrancarla.`}],after2:[{who:`mentor`,text:`El viejo Ent te ha dado su ancla. Creo que, en el fondo, quería que alguien lo liberase.`},{who:`mentor`,text:`Abrígate, {hero}: la Tundra helada es la siguiente.`}],boss3:[{who:`narrator`,text:`Un bloque de hielo del tamaño de una casa se levanta despacio.`},{who:`golem`,text:`INTRUSO DETECTADO. TEMPERATURA: DEMASIADO ALTA.`},{who:`hero`,text:`Gracias, me lo dicen mucho.`},{who:`golem`,text:`ENFRIANDO INTRUSO.`}],after3:[{who:`mentor`,text:`¡Cuatro anclas! Siento el calor del Volcán desde aquí. El Dragón ya sabe que vas a por él.`},{who:`mentor`,text:`Cuando quieras, ve. Yo guardaré el campamento... y la tienda.`}],boss4:[{who:`narrator`,text:`El cráter ruge. Las rocas caen hacia arriba, hacia el cielo rojo.`},{who:`dragon`,text:`Así que tú eres quien va recogiendo mis anclas, {hero}.`},{who:`hero`,text:`Y tú eres quien hunde las islas.`},{who:`dragon`,text:`El Abismo tiene hambre. Yo solo le doy de comer. ¿Quieres ser el plato principal?`},{who:`hero`,text:`Prefiero ser quien apaga el fogón.`}],after4:[{who:`narrator`,text:`El corazón del Dragón se apaga con un último suspiro de humo.`},{who:`dragon`,text:`Qué ingenuidad... yo solo era su perro guardián. El Abismo... ya está despierto.`},{who:`narrator`,text:`Las cinco anclas brillan a la vez y las islas dejan de caer. Pero el suelo del cráter se abre, y una escalera de piedra baja hacia la oscuridad.`},{who:`mentor`,text:`¡{hero}! Las anclas aguantan, pero algo tira desde abajo con más fuerza que nunca.`},{who:`mentor`,text:`Bajo el Volcán están las tierras de abajo: el Pantano, las Cavernas, las Ruinas, las Cumbres... y al fondo, el Corazón del Abismo.`},{who:`hero`,text:`Pues habrá que bajar. Guárdame unas pociones.`},{who:`mentor`,text:`Ahí abajo todo pega más fuerte. Mejora tu equipo antes de cada guardián, y no te avergüences de repetir combates.`}],boss5:[{who:`narrator`,text:`El agua negra burbujea. Cinco cuellos se alzan a la vez.`},{who:`hydra`,text:`¿Otro héroe? Qué bien. Cada una de mis cabezas tenía hambre.`},{who:`hero`,text:`¿Y cuál de ellas manda?`},{who:`hydra`,text:`¡YO! ¡No, YO! ¡Callaos todas y muérdelo!`}],after5:[{who:`mentor`,text:`La Hidra ya no discutirá con nadie. Bien hecho.`},{who:`mentor`,text:`Ahora, las Cavernas de cristal. Brillan muy bonito... y cortan muy feo.`}],boss6:[{who:`spider`,text:`Mis hijos me han hablado de ti. Pisas muy fuerte para caber en una de mis patas, {hero}.`},{who:`hero`,text:`Tus hijos muerden demasiado.`},{who:`spider`,text:`Han salido a su madre. No te muevas: esto solo dolerá muchísimo.`}],after6:[{who:`mentor`,text:`Sin su reina, las cavernas se han quedado en silencio. Hasta los cristales parecen respirar.`},{who:`mentor`,text:`Más abajo están las Ruinas malditas. Allí los muertos no descansan... por culpa de alguien.`}],boss7:[{who:`narrator`,text:`Las velas del altar se encienden solas, con una llama verde.`},{who:`lich`,text:`Te doy la bienvenida, {hero}. Siempre me faltan huesos para mi ejército.`},{who:`hero`,text:`Los míos están ocupados. Búscate otros.`},{who:`lich`,text:`Todos dicen eso. Al final, todos acaban trabajando para mí.`}],after7:[{who:`mentor`,text:`Los esqueletos han caído como fichas de dominó. Esas ruinas por fin descansan.`},{who:`mentor`,text:`Te quedan las Cumbres de la tormenta. Agárrate fuerte: allí el viento quiere tirarte al vacío.`}],boss8:[{who:`narrator`,text:`Un relámpago parte el cielo en dos. Algo enorme planea entre las nubes.`},{who:`thunderbird`,text:`Nadie ha subido nunca hasta mi nido. Nadie ha bajado nunca de él.`},{who:`hero`,text:`Siempre hay una primera vez.`},{who:`thunderbird`,text:`Y una última.`}],after8:[{who:`mentor`,text:`Cuatro guardianes de abajo. Solo queda el fondo, {hero}: el Corazón del Abismo.`},{who:`mentor`,text:`Es lo que arrastra las islas desde el principio. Si lo apagas, se acabó para siempre. Ve con todo lo que tengas.`}],boss9:[{who:`narrator`,text:`No hay suelo, ni cielo. Solo un latido enorme, que hace temblar todo lo que existe.`},{who:`abyss`,text:`TAN POCA COSA. TAN CÁLIDA. HAS APAGADO A MIS GUARDIANES UNO A UNO.`},{who:`hero`,text:`Y tú eres el último.`},{who:`abyss`,text:`YO SOY EL FONDO DE TODO. TODO CAE HACIA MÍ. TAMBIÉN TÚ.`},{who:`hero`,text:`Hoy no.`}],ending:[{who:`narrator`,text:`El latido se detiene. Por primera vez en mil años, el Abismo calla.`},{who:`narrator`,text:`Muy arriba, las islas dejan de temblar. Nada vuelve a tirar de ellas.`},{who:`mentor`,text:`Lo has logrado, {hero}. Diez guardianes, y el corazón del mismísimo Abismo.`},{who:`hero`,text:`¿Y ahora qué?`},{who:`mentor`,text:`Ahora descansas. Y mañana... bueno, siempre queda algún slime que aplastar.`},{who:`narrator`,text:`FIN. Gracias por jugar a La Senda del Abismo. Puedes repetir cualquier combate para hacerte aún más fuerte.`}]},sf=e=>`boss${e}`,cf=(e,t)=>e>=t-1?`ending`:`after${e}`,lf=(e,t)=>e.replace(/\{hero\}/g,t),uf=[`weapon`,`armor`,`amulet`,`head`,`feet`],df=[{name:`Común`,color:`#f2f2f2`,bonus:1,price:1,lvl:0},{name:`Rara`,color:`#5fb0ff`,bonus:1.5,price:2.2,lvl:1},{name:`Épica`,color:`#c27bff`,bonus:2.2,price:4.5,lvl:2},{name:`Legendaria`,color:`#ffa63d`,bonus:3,price:9,lv
